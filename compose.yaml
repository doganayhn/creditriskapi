name: creditrisk-local
x-app: &app
  image: creditrisk-api:phase9
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    CREDIT_RISK_PROJECT_ROOT: /app
    APP_ENV: production
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - audit-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    build: .
    environment:
      <<: *environment
      CREDIT_RISK_API_KEY: ${CREDIT_RISK_API_KEY:?Set CREDIT_RISK_API_KEY}
      CREDIT_RISK_API_KEY_ID: ${CREDIT_RISK_API_KEY_ID:?Set CREDIT_RISK_API_KEY_ID}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-65536}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./artifacts
        target: /app/artifacts
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/ready', timeout=5)"]
      interval: 5s
      timeout: 8s
      start_period: 30s
      retries: 20
    stop_grace_period: 30s
volumes:
  audit-data:
