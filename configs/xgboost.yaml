search:
  n_iter: 24
  cv_folds: 4
fixed:
  objective: binary:logistic
  eval_metric: logloss
  tree_method: hist
  device: cpu
  scale_pos_weight: 1.0
  n_jobs: 1
space:
  n_estimators: [200, 350, 500, 700]
  max_depth: [2, 3, 4, 5]
  learning_rate: [0.03, 0.05, 0.08, 0.10]
  min_child_weight: [1, 3, 5, 10]
  subsample: [0.80, 0.90, 1.00]
  colsample_bytree: [0.80, 0.90, 1.00]
  reg_lambda: [1.0, 5.0, 10.0]
  reg_alpha: [0.0, 0.1, 0.5]
  gamma: [0.0, 0.1, 0.5]
